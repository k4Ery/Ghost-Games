<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Verity 0.2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#eee;touch-action:none;overscroll-behavior:none}
#game{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;overflow:hidden}
#gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#fx{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden}
#vig{position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 42%,rgba(0,0,0,.5) 78%,rgba(0,0,0,.9) 100%)}
#grain{position:absolute;left:-30%;top:-30%;width:160%;height:160%;opacity:.10;background-size:128px 128px;animation:grain .6s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(4%,-5%)}60%{transform:translate(-3%,4%)}80%{transform:translate(5%,2%)}100%{transform:translate(0,0)}}
#chroma{position:absolute;left:0;top:0;right:0;bottom:0;mix-blend-mode:screen;opacity:.4;background:linear-gradient(90deg,rgba(255,40,40,.16),rgba(255,40,40,0) 9%,rgba(0,0,0,0) 91%,rgba(40,140,255,.16))}
#dread{position:absolute;left:0;top:0;right:0;bottom:0;opacity:0;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 30%,rgba(120,0,0,.55) 100%)}
body.saver #grain{animation:none;opacity:.06}
body.saver #chroma{display:none}
.lid{position:absolute;left:0;width:100%;height:50%;background:#000;display:none;z-index:5;pointer-events:none}
#lidT{top:0}#lidB{bottom:0}
#fade{position:absolute;left:0;top:0;right:0;bottom:0;background:#000;opacity:1;pointer-events:none;z-index:20}
#flash{position:absolute;left:0;top:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none;z-index:19}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;display:none;z-index:6}
#hint{position:absolute;top:3.5vh;left:50%;transform:translateX(-50%);max-width:80%;text-align:center;font-size:clamp(13px,2.6vmin,20px);color:#ffe27a;text-shadow:0 0 8px #000,0 0 3px #000;background:rgba(0,0,0,.35);padding:.5em 1em;border-radius:8px;display:none;z-index:6;pointer-events:none}
#edgeArrow{position:absolute;left:0;top:0;font-size:clamp(26px,6vmin,46px);color:#ffd84a;text-shadow:0 0 10px #000;display:none;z-index:6;pointer-events:none}
#subs{position:absolute;bottom:7vh;left:50%;transform:translateX(-50%);width:80%;text-align:center;font-size:clamp(15px,3.2vmin,26px);color:#fff;text-shadow:0 0 6px #000,0 0 3px #000,0 0 3px #000;z-index:7;pointer-events:none;min-height:1.4em}
#subs b{color:#ffd84a}
#hud{position:absolute;right:2vmin;top:2vmin;z-index:6;pointer-events:none;text-align:right;font-size:clamp(12px,2.4vmin,18px)}
#stamWrap{width:22vmin;height:1.4vmin;background:rgba(0,0,0,.5);border:1px solid #888;display:none;margin-bottom:6px}
#stam{height:100%;width:100%;background:#d8c64a}
#ammo{color:#fff;text-shadow:0 0 4px #000}
#joy{position:absolute;left:4vmin;bottom:6vmin;width:26vmin;height:26vmin;z-index:8;display:none}
#joyBase{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25)}
#joyStick{position:absolute;left:50%;top:50%;width:11vmin;height:11vmin;margin:-5.5vmin 0 0 -5.5vmin;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.5)}
.tbtn{position:absolute;z-index:9;display:none;border:2px solid rgba(255,255,255,.55);background:rgba(20,20,20,.55);color:#fff;font-weight:700;border-radius:50%;font-size:clamp(11px,2.5vmin,18px);text-shadow:0 0 4px #000;touch-action:none;padding:0}
#btnAct{right:5vmin;bottom:22vmin;min-width:20vmin;height:12vmin;border-radius:7vmin;padding:0 3vmin;font-size:clamp(13px,3vmin,22px);background:rgba(190,150,20,.7)}
#btnRun{right:5vmin;bottom:5vmin;width:16vmin;height:16vmin}
#btnShoot{right:24vmin;bottom:7vmin;width:17vmin;height:17vmin;background:rgba(160,30,30,.7)}
body.desk #btnAct{left:50%;right:auto;bottom:17vh;transform:translateX(-50%);border-radius:8px;font-size:clamp(14px,2.6vmin,20px);height:auto;padding:.5em 1.2em;background:rgba(0,0,0,.55);border-color:rgba(255,216,74,.8);color:#ffd84a}
#phoneOv{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.72);display:none;z-index:12;align-items:center;justify-content:center}
#phoneFrame{position:relative;height:92vh;aspect-ratio:9/16;max-width:90vw;background:#050505;border:3px solid #333;border-radius:20px;padding:6px;box-shadow:0 0 40px #000}
#phoneCv{width:100%;height:100%;display:block;border-radius:14px;background:#111;touch-action:none}
#callBtn{position:absolute;left:12%;right:12%;bottom:7%;height:11%;display:none;border:0;border-radius:30px;background:#2ecc55;color:#fff;font-size:clamp(15px,3.4vmin,24px);font-weight:700;box-shadow:0 0 18px #2ecc55;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#phoneTip{position:absolute;left:0;right:0;bottom:-3.4vh;text-align:center;font-size:clamp(11px,2.2vmin,15px);color:#aaa}
#endScr{position:absolute;left:0;top:0;right:0;bottom:0;background:#000;display:none;z-index:22;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity 3s}
#endScr h1{font-size:clamp(28px,8vmin,64px);margin:0 0 .4em;color:#f1e27a;letter-spacing:.05em}
#endScr p{font-size:clamp(14px,3.4vmin,26px);margin:0 0 1.2em;color:#ccc}
.btn{padding:.7em 1.6em;font-size:clamp(16px,3.4vmin,24px);background:#d8c64a;color:#111;border:0;border-radius:8px;font-weight:700;cursor:pointer}
#menu,#loading,#rotate,#pause{position:fixed;left:0;top:0;right:0;bottom:0;background:#050403;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2vh 4vw}
#menu h1{font-size:clamp(34px,11vmin,92px);margin:0;color:#e8d84a;letter-spacing:.2em;text-shadow:0 0 22px #a89a1a}
#menu .sub{color:#aaa;margin:.4em 0 1em;font-size:clamp(12px,2.6vmin,18px)}
#menu label{display:block;margin:.35em 0;font-size:clamp(13px,2.7vmin,18px);color:#ddd}
#menu select{font-size:inherit;background:#222;color:#eee;border:1px solid #666;padding:.2em .4em;margin-left:.4em}
#menu .help{max-width:640px;font-size:clamp(11px,2.2vmin,15px);color:#888;margin:.8em 0 1em;line-height:1.5}
#loading{display:flex}
#lbarW{width:60vw;max-width:420px;height:8px;background:#222;margin-top:14px}
#lbar{height:100%;width:0;background:#d8c64a}
#rotate{z-index:60;font-size:clamp(18px,5vmin,30px)}
#rotate .ph{font-size:60px;animation:rot 2s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
#endNum{font-size:clamp(12px,2.8vmin,20px);color:#9a8f4a;letter-spacing:.3em;margin-bottom:.4em}
#endTime{font-size:clamp(16px,4.2vmin,30px);color:#fff;margin:0 0 .5em}
#endText{font-size:clamp(12px,2.8vmin,20px);color:#aaa;line-height:1.4}
.elist{display:flex;flex-wrap:wrap;gap:.3em 1em;justify-content:center;font-size:clamp(11px,2.3vmin,16px);color:#666;margin:.4em 4vw .8em;max-width:90vw}
.elist .got{color:#cdbf55}.elist .cur{color:#fff;text-decoration:underline}
#pause{background:rgba(0,0,0,.8);z-index:40;font-size:clamp(18px,4vmin,28px);cursor:pointer}
</style>
</head>
<body class="desk">
<div id="game">
  <canvas id="gl"></canvas>
  <div id="fx"><div id="chroma"></div><div id="dread"></div><div id="vig"></div><div id="grain"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* ================= УТИЛИТЫ ================= */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash3(a,b,c){let h=(Math.imul(a,374761393)+Math.imul(b,668265263)+Math.imul(c,2147483647))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return h>>>0;}
const IS_MOBILE=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)||/[?&]mobile=1/.test(location.search);
document.body.classList.toggle('desk',!IS_MOBILE);
const S={quality:'auto',saver:false,fullscreen:true};

/* ================= РЕНДЕРЕР И КАЧЕСТВО ================= */
const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:!IS_MOBILE,powerPreference:'high-performance',alpha:false,stencil:false});
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=IS_MOBILE?THREE.BasicShadowMap:THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000,1);
const ANISO=Math.min(IS_MOBILE?2:4,renderer.capabilities.getMaxAnisotropy()||1);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.05,120);
camera.rotation.order='YXZ';
const QP={low:{scale:.65,shadow:false,fog:.75,mcFps:9,mcRes:.75},med:{scale:.85,shadow:true,fog:.9,mcFps:12,mcRes:1},high:{scale:1,shadow:true,fog:1,mcFps:15,mcRes:1}};
const Q={scale:1,fog:1,shadow:true,mcFps:12,target:IS_MOBILE?45:60,auto:true,maxPR:IS_MOBILE?1.5:2,lastShadow:null};
function applyQuality(){
  let p=null;
  if(S.quality==='auto'){Q.auto=true;}else{Q.auto=false;p=QP[S.quality];Q.scale=p.scale;Q.fog=p.fog;Q.shadow=p.shadow;Q.mcFps=p.mcFps;}
  if(Q.auto){Q.mcFps=IS_MOBILE?10:15;Q.shadow=true;if(Q.scale<.55||Q.scale>1)Q.scale=IS_MOBILE?.85:1;Q.fog=Math.min(Q.fog,1);}
  Q.target=S.saver?30:(IS_MOBILE?45:60);
  if(S.saver){Q.scale=Math.min(Q.scale,.85);Q.mcFps=Math.min(Q.mcFps,9);}
  document.body.classList.toggle('saver',S.saver);
  resize();
}
function resize(){
  const pr=Math.min(window.devicePixelRatio||1,Q.maxPR)*Q.scale;
  renderer.setPixelRatio(pr);
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
}
function setShadows(on){
  if(Q.lastShadow===on)return;Q.lastShadow=on;
  if(window.__H&&window.__H.sun)window.__H.sun.castShadow=on;
}

/* ================= ЗВУК (Web Audio, всё процедурно) ================= */
const A=(function(){
  let ctx=null,master=null,bufs={},active=0,amb={},heartT=0,ready=false;
  const MAXA=8;
  function make(dur,fn){const sr=ctx.sampleRate,n=(sr*dur)|0,b=ctx.createBuffer(1,n,sr),d=b.getChannelData(0);fn(d,sr,n);return b;}
  function build(){
    const R=Math.random;
    bufs.stepC=make(.2,(d,sr,n)=>{let lp=0;for(let i=0;i<n;i++){const t=i/sr,e=Math.exp(-t*34);lp+=((R()*2-1)-lp)*.2;d[i]=(lp*1.8+Math.sin(TAU*80*t)*.5)*e*.7;}});
    bufs.stepW=make(.16,(d,sr,n)=>{let lp=0;for(let i=0;i<n;i++){const t=i/sr,e=Math.exp(-t*55);lp+=((R()*2-1)-lp)*.55;d[i]=(lp*1.1+Math.sin(TAU*150*t)*.6)*e*.7;}});
    const bt=(t,f)=>t<0?0:(Math.sin(TAU*f*t)+.4*Math.sin(TAU*f*2.01*t)+.2*Math.sin(TAU*f*3.2*t))*Math.exp(-t*3.2);
    bufs.bell=make(2.4,(d,sr,n)=>{for(let i=0;i<n;i++){const t=i/sr;d[i]=(bt(t,659.3)+bt(t-.8,523.3))*.33;}});
    bufs.tone=make(1,(d,sr,n)=>{for(let i=0;i<n;i++){const t=i/sr,e=Math.min(1,t*40,(1-t)*40);d[i]=Math.sin(TAU*425*t)*e*.25;}});
    bufs.creak=make(1.6,(d,sr,n)=>{let ph=0,lp=0;for(let i=0;i<n;i++){const t=i/sr,f=150+90*Math.sin(t*3.1)+60*Math.sin(t*11.3);ph+=f/sr;const s=(ph%1)*2-1;lp+=(s-lp)*.12;d[i]=(lp+(R()*2-1)*.12)*Math.pow(Math.sin(Math.PI*t/1.6),.7)*.35;}});
    bufs.shot=make(1.2,(d,sr,n)=>{let lp=0;for(let i=0;i<n;i++){const t=i/sr;lp+=((R()*2-1)-lp)*.4;d[i]=(lp*Math.exp(-t*16)*1.2+Math.sin(TAU*(55+130*Math.exp(-t*22))*t)*Math.exp(-t*10)*.9+(R()*2-1)*Math.exp(-t*3)*.12)*.8;}});
    bufs.boom=make(2.6,(d,sr,n)=>{let lp=0;for(let i=0;i<n;i++){const t=i/sr;lp+=((R()*2-1)-lp)*.06;d[i]=(Math.sin(TAU*(30+80*Math.exp(-t*3))*t)*Math.exp(-t*1.4)+lp*Math.exp(-t*4)*2)*.95;}});
    bufs.sting=make(2.8,(d,sr,n)=>{const fs=[233,247,349,370,523];for(let i=0;i<n;i++){const t=i/sr;let v=0;for(let k=0;k<fs.length;k++){const ph=((fs[k]*(1-.1*t)*t)%1)*2-1;v+=ph*.12;}d[i]=(v+(R()*2-1)*.08*Math.exp(-t*2))*Math.min(1,t*60)*Math.exp(-t*1.3)*.7;}});
    bufs.scream=make(2,(d,sr,n)=>{let ph=0,ph2=0;for(let i=0;i<n;i++){const t=i/sr,f=650+420*Math.sin(t*9)+300*t;ph+=f/sr;ph2+=f*1.52/sr;const v=((ph%1)*2-1)*.5+((ph2%1)*2-1)*.35+(R()*2-1)*.5;d[i]=Math.tanh(v*1.6)*Math.min(1,t*80)*Math.exp(-t*1.3)*.8;}});
    bufs.heart=make(.9,(d,sr,n)=>{const th=(t,a)=>t<0?0:Math.sin(TAU*52*t)*Math.exp(-t*20)*a;for(let i=0;i<n;i++){const t=i/sr;d[i]=th(t,1)+th(t-.27,.7);}});
    bufs.wake=make(2.8,(d,sr,n)=>{let lp=0;for(let i=0;i<n;i++){const t=i/sr;lp+=((R()*2-1)-lp)*.04;d[i]=lp*Math.pow(Math.sin(Math.PI*t/2.8),2)*3+Math.sin(TAU*60*t)*.08*Math.sin(Math.PI*t/2.8);}});
    bufs.fall=make(1.9,(d,sr,n)=>{let ph=0,lp=0;for(let i=0;i<n;i++){const t=i/sr;ph+=1100*Math.exp(-t*2.6)/sr;lp+=((R()*2-1)-lp)*.1;d[i]=(Math.sin(TAU*ph)*.25+lp*.6)*Math.min(1,t*10)*Math.exp(-t*.8);}});
    bufs.boing=make(.55,(d,sr,n)=>{let ph=0;for(let i=0;i<n;i++){const t=i/sr;ph+=(320+380*Math.abs(Math.sin(t*14))*Math.exp(-t*2))/sr;d[i]=Math.sin(TAU*ph)*Math.exp(-t*5)*.5;}});
    bufs.oink=make(.5,(d,sr,n)=>{let ph=0,lp=0;for(let i=0;i<n;i++){const t=i/sr,f=(190-110*t)*(1+.12*Math.sin(t*70));ph+=f/sr;const sq=((ph%1)*2-1);lp+=(sq-lp)*.22;const g=.55+.45*Math.sin(t*28);d[i]=(lp*.9+(R()*2-1)*.14)*Math.min(1,t*50)*Math.exp(-t*4.2)*g*.7;}});
    bufs.click=make(.05,(d,sr,n)=>{for(let i=0;i<n;i++){d[i]=(R()*2-1)*Math.exp(-i/sr*160)*.5;}});
    bufs.pump=make(.4,(d,sr,n)=>{let lp=0;for(let i=0;i<n;i++){const t=i/sr;lp+=((R()*2-1)-lp)*.3;d[i]=lp*(Math.exp(-t*60)+.8*Math.exp(-Math.pow((t-.2)*40,2)))*.6;}});
    bufs.noiseLoop=make(2,(d,sr,n)=>{for(let i=0;i<n;i++)d[i]=R()*2-1;});
  }
  function startLoops(){
    const hg=ctx.createGain();hg.gain.value=0;hg.connect(master);
    [[100,'sine',.5],[50,'sawtooth',.16],[200,'sine',.1]].forEach(a=>{const o=ctx.createOscillator();o.type=a[1];o.frequency.value=a[0];const g=ctx.createGain();g.gain.value=a[2];o.connect(g);g.connect(hg);o.start();});
    amb.hum=hg;
    const dg=ctx.createGain();dg.gain.value=0;dg.connect(master);
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;lp.connect(dg);
    [[55,'sawtooth'],[55.6,'sawtooth'],[82.4,'sine'],[110.7,'triangle']].forEach(a=>{const o=ctx.createOscillator();o.type=a[1];o.frequency.value=a[0];const g=ctx.createGain();g.gain.value=.25;o.connect(g);g.connect(lp);o.start();});
    const lfo=ctx.createOscillator();lfo.frequency.value=.12;const lg=ctx.createGain();lg.gain.value=90;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
    amb.drone=dg;
    const ns=ctx.createBufferSource();ns.buffer=bufs.noiseLoop;ns.loop=true;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.6;
    const wg=ctx.createGain();wg.gain.value=0;ns.connect(bp);bp.connect(wg);wg.connect(master);ns.start();amb.wind=wg;
    const hi=ctx.createGain();hi.gain.value=0;hi.connect(master);
    [1180,1187].forEach(f=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(hi);o.start();});
    amb.dread=hi;
  }
  return {
    init(){
      if(ctx){if(ctx.state==='suspended')ctx.resume();return;}
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      try{ctx=new AC();}catch(e){ctx=null;return;}

const Input={keys:{},lookX:0,lookY:0,run:false,act:false,shoot:false,joyX:0,joyY:0,locked:false};
const isTouchUI=IS_MOBILE;
(function(){
  const keys=Input.keys;
  addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(e.code==='KeyE'&&!e.repeat)Input.act=true;
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].indexOf(e.code)>=0)e.preventDefault();
  });
  addEventListener('keyup',e=>{keys[e.code]=false;});
  addEventListener('blur',()=>{for(const k in keys)keys[k]=false;Input.run=false;});
  document.addEventListener('pointerlockchange',()=>{Input.locked=document.pointerLockElement===canvas;if(window.__onLock)window.__onLock();});
  document.addEventListener('mousemove',e=>{
    if(Input.locked){Input.lookX+=e.movementX||0;Input.lookY+=e.movementY||0;}
  });
  canvas.addEventListener('mousedown',e=>{
    if(IS_MOBILE)return;
    if(!Input.locked){if(window.__wantLock&&window.__wantLock())requestLock();return;}
    if(e.button===0)Input.mouseDown=true;
  });
  addEventListener('mouseup',()=>{Input.mouseDown=false;});
  // Тач: плавающий обзор справа, джойстик слева
  const joy=$('joy'),stick=$('joyStick'),base=$('joyBase');
  let joyId=-1,lookId=-1,jx=0,jy=0,lx=0,ly=0;
  const R=()=>base.getBoundingClientRect();
  function joyMove(e){
    const r=R(),cx=r.left+r.width/2,cy=r.top+r.height/2,rad=r.width/2;
    let dx=(e.clientX-cx)/rad,dy=(e.clientY-cy)/rad;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}
    Input.joyX=Math.abs(dx)<.12?0:dx;Input.joyY=Math.abs(dy)<.12?0:dy;
    stick.style.transform='translate('+(dx*rad*.6)+'px,'+(dy*rad*.6)+'px)';
  }
  function joyEnd(){joyId=-1;Input.joyX=0;Input.joyY=0;stick.style.transform='';}
  const game=$('game');
  game.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    if(e.target.closest&&e.target.closest('button,#phoneOv'))return;
    if(e.clientX<innerWidth*.45&&joyId<0){joyId=e.pointerId;joyMove(e);}
    else if(lookId<0){lookId=e.pointerId;lx=e.clientX;ly=e.clientY;}
  });
  game.addEventListener('pointermove',e=>{
    if(e.pointerType==='mouse')return;
    if(e.pointerId===joyId)joyMove(e);
    else if(e.pointerId===lookId){Input.lookX+=(e.clientX-lx)*1.5;Input.lookY+=(e.clientY-ly)*1.5;lx=e.clientX;ly=e.clientY;}
  });
  const up=e=>{if(e.pointerId===joyId)joyEnd();if(e.pointerId===lookId)lookId=-1;};
  game.addEventListener('pointerup',up);game.addEventListener('pointercancel',up);
  const bind=(id,down,upf)=>{const b=$(id);
    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();down();});
    const u=e=>{e.stopPropagation();if(upf)upf();};b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u);b.addEventListener('pointerleave',u);};
  bind('btnAct',()=>{Input.act=true;});
  bind('btnRun',()=>{Input.run=true;},()=>{Input.run=false;});
  bind('btnShoot',()=>{Input.shoot=true;});
})();

  const k=Input.keys;
  let x=Input.joyX,y=-Input.joyY;
  if(k.KeyW||k.ArrowUp)y+=1;if(k.KeyS||k.ArrowDown)y-=1;if(k.KeyD||k.ArrowRight)x+=1;if(k.KeyA||k.ArrowLeft)x-=1;

/* ================= BACKROOMS: генерация, чанки, ИИ ================= */
const CELL=1.25,CS=20,WH=3.2,CHM=CS*CELL,HUB=CS>>1;
const W={mode:'maze',seed:1,cache:new Map(),pcx:99999,pcz:99999,exitC:null,exitPos:null,queue:[]};
const ckey=(cx,cz)=>(cx+2048)*4096+(cz+2048);
function evict(){for(const k of W.cache.keys()){const cx=((k/4096)|0)-2048,cz=(k%4096)-2048;if(Math.abs(cx-W.pcx)>3||Math.abs(cz-W.pcz)>3)W.cache.delete(k);}}
function chunkData(cx,cz){const k=ckey(cx,cz);let d=W.cache.get(k);if(!d){d=W.mode==='maze'?genMaze(cx,cz):genCorridor(cx,cz);W.cache.set(k,d);if(W.cache.size>60)evict();}return d;}
function cellAt(gx,gz){const cx=Math.floor(gx/CS),cz=Math.floor(gz/CS);return chunkData(cx,cz)[(gz-cz*CS)*CS+(gx-cx*CS)];}
const cellOf=v=>Math.floor(v/CELL);
function edgeDoors(kind,ex,ez){const r=mulberry32(hash3(W.seed+kind*7919,ex,ez));return [2+(r()*(CS-6)|0),2+(r()*(CS-6)|0)];}
function genMaze(cx,cz){
  const rng=mulberry32(hash3(W.seed,cx,cz)),a=new Uint8Array(CS*CS);
  for(let i=0;i<CS;i++){a[i]=1;a[(CS-1)*CS+i]=1;a[i*CS]=1;a[i*CS+CS-1]=1;}
  const set=(x,z,v)=>{if(x>=0&&z>=0&&x<CS&&z<CS)a[z*CS+x]=v;};
  function split(x0,z0,x1,z1,dep){
    const w=x1-x0+1,h=z1-z0+1;
    if((w<8&&h<8)||dep>4||(dep>1&&rng()<.14)){

function tweenPose(to,dur,mode,done){
  const f={x:camera.position.x,y:camera.position.y,z:camera.position.z,yaw:camera.rotation.y,pitch:camera.rotation.x};
  let dy=to.yaw-f.yaw;while(dy>Math.PI)dy-=TAU;while(dy<-Math.PI)dy+=TAU;
  pl.mode='tween';
  tween(dur,t=>{const e=ease(t);camera.position.set(lerp(f.x,to.x,e),lerp(f.y,to.y,e),lerp(f.z,to.z,e));camera.rotation.set(lerp(f.pitch,to.pitch,e),f.yaw+dy*e,0);},
    ()=>{pl.mode=mode;pl.yaw=to.yaw;pl.pitch=to.pitch;if(mode==='free'){pl.pos.set(to.x,0,to.z);pl.pitch=0;}if(done)done();});
}

/* ---- Игрок ---- */
const mv={x:0,y:0};
function resolveBoxes(p,r){
  for(const b of H.boxes){
    if(b.on===false)continue;
    const cx=clamp(p.x,b.x0,b.x1),cz=clamp(p.z,b.z0,b.z1),dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
    if(d2<r*r){
      if(d2>1e-8){const d=Math.sqrt(d2);p.x=cx+dx/d*r;p.z=cz+dz/d*r;}
      else{const l=p.x-b.x0,rr=b.x1-p.x,t=p.z-b.z0,bt=b.z1-p.z,m=Math.min(l,rr,t,bt);if(m===l)p.x=b.x0-r;else if(m===rr)p.x=b.x1+r;else if(m===t)p.z=b.z0-r;else p.z=b.z1+r;}
    }
  }
}
function updatePlayer(dt){
  const sens=IS_MOBILE?.0042:.0022;
  const lx=Input.lookX,ly=Input.lookY;Input.lookX=0;Input.lookY=0;
  if(pl.mode==='seated'){MC.P.yaw-=lx*sens;MC.P.pitch=clamp(MC.P.pitch-ly*sens,-1.4,1.4);}
  else if(pl.mode==='free'||pl.mode==='lying'){pl.yaw-=lx*sens;pl.pitch=clamp(pl.pitch-ly*sens,-1.45,1.45);}
  if(pl.mode==='lying'){pl.yaw=clamp(pl.yaw,Math.PI-.9,Math.PI+.9);pl.pitch=clamp(pl.pitch,.1,1.1);}
  pl.moving=false;pl.running=false;
  if(pl.mode==='seated'&&G.stage==='mc'){moveAxes(mv);if(mv.x||mv.y)MC.move(dt,mv.x,mv.y);}
  if(pl.mode!=='free'||G.freeze)return;
  moveAxes(mv);
  const inBack=G.scene==='back';
  let run=inBack&&isRun()&&(mv.x||mv.y);
  if(run&&pl.exhausted)run=false;
  if(inBack){
    if(run){pl.stam=Math.max(0,pl.stam-dt/6.5);if(pl.stam<=0)pl.exhausted=true;}
    else pl.stam=Math.min(1,pl.stam+dt/(mv.x||mv.y?5:3));
    if(pl.exhausted&&pl.stam>.3)pl.exhausted=false;
  }
  const speed=inBack?(run?4.9:(pl.exhausted?2.0:2.5)):2.2;
  const sy=Math.sin(pl.yaw),cy=Math.cos(pl.yaw);
  const dx=(-sy*mv.y+cy*mv.x)*speed*dt,dz=(-cy*mv.y-sy*mv.x)*speed*dt;
  if(mv.x||mv.y){
    pl.moving=true;pl.running=run;
    if(inBack)brMove(pl.pos,dx,dz,.3);else{pl.pos.x+=dx;resolveBoxes(pl.pos,.28);pl.pos.z+=dz;resolveBoxes(pl.pos,.28);}
    const d=Math.hypot(dx,dz);pl.stepAcc+=d;pl.bob+=d*(run?3.4:4.6);
    if(pl.stepAcc>(run?1.7:1.15)){pl.stepAcc=0;A.play(inBack?'stepC':'stepW',run?.55:.38,rnd(.9,1.1));}
  }
}
function applyCamera(dt){
  if(pl.mode==='free'){
    const bobY=pl.moving?Math.sin(pl.bob)*(pl.running?.05:.028):0;
    camera.position.set(pl.pos.x,1.62+bobY,pl.pos.z);camera.rotation.set(pl.pitch,pl.yaw,pl.moving?Math.sin(pl.bob*.5)*.004:0);
  }else if(pl.mode==='lying'){
    camera.position.set(POSE.lying.x,POSE.lying.y+Math.sin(G.time*1.2)*.008,POSE.lying.z);camera.rotation.set(pl.pitch,pl.yaw,0);
  }else if(pl.mode==='seated'){
    camera.position.set(POSE.seat.x,POSE.seat.y+Math.sin(G.time*1.1)*.004,POSE.seat.z);camera.rotation.set(POSE.seat.pitch,0,0);
  }
  if(G.shake>.01){camera.rotation.x+=rnd(-1,1)*G.shake*.03;camera.rotation.y+=rnd(-1,1)*G.shake*.03;camera.rotation.z+=rnd(-1,1)*G.shake*.05;G.shake*=Math.pow(.02,dt);}
  const wantFov=(G.scene==='back'&&pl.running)?78:72;if(G.stage!=='falling'&&Math.abs(camera.fov-wantFov)>.1){camera.fov+=(wantFov-camera.fov)*Math.min(1,dt*6);camera.updateProjectionMatrix();}
}

/* ---- Интерактивные объекты (raycast раз в 100 мс) ---- */
const IAs=[];
const ray=new THREE.Raycaster(),rdir=new THREE.Vector3(),tmpV=new THREE.Vector3();
let curIA=null;
function addIA(o){IAs.push(o);}
function updateInteract(dt){
  G.iaT-=dt;
  if(G.iaT<=0){
    G.iaT=.1;curIA=null;
    if(pl.mode==='free'&&!G.freeze){
      camera.getWorldDirection(rdir);ray.set(camera.position,rdir);
      let best=1e9;
      for(const ia of IAs){
        if(ia.scene!==G.scene||!ia.enabled())continue;
        ray.far=ia.reach;const hit=ray.intersectObject(ia.proxy,false);
        if(hit.length&&hit[0].distance<best){best=hit[0].distance;curIA=ia;}
      }
    }else if(pl.mode==='seated'&&G.stage==='mc')curIA=MCIA;
  }
  const on=!!curIA;
  if(on){const lbl=curIA.label;if($act.dataset.l!==lbl){$act.dataset.l=lbl;$act.textContent=IS_MOBILE?lbl:'[E] '+lbl;}}
  show($act,'act',on);
  if(Input.mouseDown){Input.mouseDown=false;if(G.gun)Input.shoot=true;else Input.act=true;}
  if(Input.act){Input.act=false;if(curIA){const r=curIA;curIA=null;A.play('click',.4);r.run();}}
}
const MCIA={label:'Ломать блок',run:()=>{const r=MC.breakBlock();if(r==='pig')pigEnd();else if(r)A.play('click',.6);}};

/* ---- Verity-шарик ---- */
const ballTgt=new THREE.Vector3(),rv=new THREE.Vector3(),uv=new THREE.Vector3(0,1,0);
function updateBall(dt){
  if(!BallM.visible)return;
  const t=G.time;
  if(G.ballMode==='follow'){
    camera.getWorldDirection(rdir);rv.crossVectors(rdir,uv).normalize();
    ballTgt.copy(camera.position).addScaledVector(rdir,1.6).addScaledVector(rv,.85);ballTgt.y+=.3;
    ballTgt.x=clamp(ballTgt.x,-2.7,2.7);ballTgt.z=clamp(ballTgt.z,-2.2,6);ballTgt.y=clamp(ballTgt.y,.7,2.3);
    BallM.position.lerp(ballTgt,Math.min(1,dt*3.5));
  }else if(G.ballMode==='fixed'){ballTgt.set(2.2,1.55,-1.55);BallM.position.lerp(ballTgt,Math.min(1,dt*3));}
  const bob=Math.sin(t*2.2)*.05;
  BallM.children[0].position.y=bob;BallM.children[1].position.y=bob;
  BallM.quaternion.copy(camera.quaternion);
  BallM.userData.glow.material.opacity=.55+.15*Math.sin(t*3);
}

/* ---- Подсказки: маркер в мире + стрелка по краю экрана ---- */
const pv=new THREE.Vector3();
function updateMarker(dt){
  if(!G.objT){marker.visible=false;show($edge,'edge',false);return;}
  marker.visible=true;marker.position.set(G.objT.x,G.objT.y+.3+Math.sin(G.time*3)*.08,G.objT.z);
  const d=camera.position.distanceTo(marker.position);marker.scale.setScalar(clamp(d*.12,.8,3));marker.rotation.y+=dt*2;
  pv.copy(G.objT).project(camera);
  let sx=pv.x,sy=pv.y;const behind=pv.z>1;if(behind){sx=-sx;sy=-sy;}
  const inside=!behind&&Math.abs(sx)<.88&&Math.abs(sy)<.8;
  if(inside){show($edge,'edge',false);return;}
  let m=Math.max(Math.abs(sx)/.9,Math.abs(sy)/.8);if(m<1e-4){sx=0;sy=-1;m=1;}
  sx/=m;sy/=m;
  const px=(sx*.5+.5)*innerWidth,py=(1-(sy*.5+.5))*innerHeight,ang=Math.atan2(-sy,sx);
  $edge.style.transform='translate('+(px-16)+'px,'+(py-16)+'px) rotate('+ang+'rad)';show($edge,'edge',true);
}

/* ---- Концовка №4: «СвиноПад» (сломали свинью в Майнкрафте) ---- */
const pigs=[];let pigGroup=null;
const pigMats={body:lam({color:0xf2a3b3}),dark:lam({color:0xd9808f}),eye:new THREE.MeshBasicMaterial({color:0x111111})};
function buildPig(){
  const g=new THREE.Group(),m=pigMats;
  bx(g,m.body,.28,.26,.46,0,.27,0,false);bx(g,m.body,.24,.22,.2,0,.32,-.3,false);bx(g,m.dark,.12,.09,.05,0,.29,-.42,false);
  bx(g,m.eye,.03,.03,.02,-.06,.37,-.405,false);bx(g,m.eye,.03,.03,.02,.06,.37,-.405,false);
  bx(g,m.dark,.06,.07,.03,-.1,.45,-.27,false);bx(g,m.dark,.06,.07,.03,.1,.45,-.27,false);
  [[-.09,-.15],[.09,-.15],[-.09,.15],[.09,.15]].forEach(p=>bx(g,m.dark,.07,.15,.07,p[0],.075,p[1],false));
  bx(g,m.dark,.03,.03,.06,0,.34,.25,false);
  g.scale.setScalar(rnd(.8,1.3));return g;
}
function pigBlocked(x,z,r){
  if(x<-2.85||x>2.85||z<-2.35||z>6.3)return true;
  for(const b of H.boxes){if(b.on===false)continue;if(x>b.x0-r&&x<b.x1+r&&z>b.z0-r&&z<b.z1+r)return true;}
  return false;
}
function spawnPigs(n){
  if(!pigGroup){pigGroup=new THREE.Group();H.scene.add(pigGroup);}
  for(let i=0;i<n;i++){
    let x=0,z=0;for(let k=0;k<30;k++){x=rnd(-2.7,2.7);z=rnd(-2.2,6.2);if(!pigBlocked(x,z,.3)&&Math.hypot(x-pl.pos.x,z-pl.pos.z)>.9)break;}
    const m=buildPig();m.visible=false;m.rotation.y=rnd(0,TAU);pigGroup.add(m);
    pigs.push({m:m,x:x,y:3.2,z:z,vy:0,hx:0,hz:0,air:true,t:0,delay:.4+i*.14+rnd(0,.3),yaw:m.rotation.y});
  }
}
function clearPigs(){if(pigGroup)for(const p of pigs)pigGroup.remove(p.m);pigs.length=0;}
function updatePigs(dt){
  for(const p of pigs){
    if(p.delay>0){p.delay-=dt;if(p.delay<=0)p.m.visible=true;else continue;}
    if(p.air){
      p.vy-=9.8*dt;p.y+=p.vy*dt;
      if(p.hx||p.hz){const nx=p.x+p.hx*dt,nz=p.z+p.hz*dt;if(!pigBlocked(nx,nz,.22)){p.x=nx;p.z=nz;}else{p.hx=p.hz=0;}}
      if(p.y<=0){p.y=0;if(p.vy<-3){if(Math.random()<.3)A.play('oink',.28,rnd(.9,1.9));p.vy=-p.vy*.38;}else{p.air=false;p.vy=0;p.hx=p.hz=0;p.t=rnd(.4,2.2);}}
    }else{
      p.t-=dt;
      if(p.t<=0){p.air=true;p.vy=rnd(1.8,3.2);p.yaw=rnd(0,TAU);const sp=rnd(.2,.9);p.hx=-Math.sin(p.yaw)*sp;p.hz=-Math.cos(p.yaw)*sp;if(Math.random()<.12)A.play('oink',.22,rnd(1,2));}
    }
    p.m.position.set(p.x,p.y,p.z);p.m.rotation.y+=(p.yaw-p.m.rotation.y)*Math.min(1,dt*8);p.m.rotation.x=p.air?-p.vy*.05:0;
  }
}
function pigEnd(){
  if(G.stage!=='mc')return;
  G.stage='pigs';stopClock();clearObj();
  A.play('oink',1,1.1);A.play('boing',.6);flashScreen('#ffb3c6',.8,.7);G.shake=.6;

function step(dt){
  G.time+=dt;
  for(let i=timers.length-1;i>=0;i--){const t=timers[i];t.t-=dt;if(t.t<=0){timers.splice(i,1);try{t.fn();}catch(e){console.error(e);}}}
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];t.t+=dt;const k=Math.min(1,t.t/t.d);t.fn(k);if(k>=1){tweens.splice(i,1);if(t.done)t.done();}}
  if(subTimer>0){subTimer-=dt;if(subTimer<=0)$subs.innerHTML='';}
  updatePlayer(dt);updateInteract(dt);
  if(Input.shoot){Input.shoot=false;shoot();}
  if(G.scene==='house')updateHouse(dt);else updateBack(dt);
  PH.frame(dt);
  applyCamera(dt);updateMarker(dt);
  // HUD
  const inBack=G.scene==='back',free=pl.mode==='free'&&!G.freeze;
  show($run,'run',IS_MOBILE&&inBack&&free);show($shoot,'shoot',IS_MOBILE&&G.gun&&free);
  show($joy,'joy',IS_MOBILE&&G.started&&(free||G.stage==='mc'));
  show($stamW,'stam',inBack&&free);if(inBack)$stam.style.width=(pl.stam*100).toFixed(0)+'%';
  show($ammo,'ammo',G.gun&&inBack);
  show($cross,'cross',free&&!PH.isOpen());
  // пост-эффекты (CSS): искажение рядом с монстром
  const d=G.scene==='back'?(G.dread||0):0;
  if(Math.abs(d-fxD)>.02){fxD=d;$dread.style.opacity=(d*d*.9).toFixed(2);$chroma.style.opacity=(.4+d*.9).toFixed(2);}
  canvas.style.transform=d>.55?'translate('+rnd(-1,1)*d*3+'px,'+rnd(-1,1)*d*3+'px) scale(1.02)':(canvas.style.transform?'':'');
}

/* ---- Главный цикл: FPS-лимит, адаптивное качество, пауза ---- */
let raf=0,lastT=0,fpsN=0,fpsT=0;
function shouldRun(){return G.started&&!document.hidden&&!G.rotateBlock&&!G.userPause;}
function loop(now){
  raf=0;if(!shouldRun())return;raf=requestAnimationFrame(loop);
  const iv=1000/Q.target,el=now-lastT;if(el<iv-2)return;
  lastT=now-(el%iv);const dt=Math.min(el/1000,.1);
  step(dt);renderer.render(active,camera);
  fpsN++;fpsT+=el;
  if(fpsT>=2000){
    const fps=fpsN/(fpsT/1000);fpsN=0;fpsT=0;
    if(Q.auto){
      if(fps<Q.target*.85&&Q.scale>.55){Q.scale=Math.max(.55,Q.scale-.1);Q.fog=Math.max(.75,Q.fog-.05);if(Q.scale<.7)Q.shadow=false;resize();}
      else if(fps>Q.target*.95&&Q.scale<1){Q.scale=Math.min(1,Q.scale+.05);Q.fog=Math.min(1,Q.fog+.03);if(Q.scale>.8)Q.shadow=true;resize();}
    }
  }
}
function kick(){if(!raf&&shouldRun()){lastT=performance.now();raf=requestAnimationFrame(loop);A.resume();}}
function haltLoop(){if(raf){cancelAnimationFrame(raf);raf=0;}A.suspend();}
function checkPause(){if(shouldRun())kick();else haltLoop();}
document.addEventListener('visibilitychange',checkPause);
function checkOrient(){
  const block=IS_MOBILE&&innerHeight>innerWidth;G.rotateBlock=block;$('rotate').style.display=block&&G.started?'flex':'none';checkPause();
}
addEventListener('resize',()=>{resize();checkOrient();});addEventListener('orientationchange',()=>setTimeout(()=>{resize();checkOrient();},200));
window.__wantLock=()=>G.started&&!G.noLock&&!G.ending&&!IS_MOBILE&&!PH.isOpen();
window.__onLock=function(){
  if(IS_MOBILE||!G.started)return;
  if(Input.locked){G.userPause=false;$('pause').style.display='none';checkPause();}
  else if(window.__wantLock()){G.userPause=true;$('pause').style.display='flex';checkPause();}
};
$('pause').addEventListener('click',()=>{requestLock();});

  steps.push(['Backrooms…',()=>{buildBackrooms();}]);
  steps.push(['Интерфейс…',()=>{
    marker=new THREE.Group();const cone=new THREE.Mesh(new THREE.ConeGeometry(.12,.32,12),new THREE.MeshBasicMaterial({color:0xffd84a,depthTest:false,transparent:true,opacity:.92,fog:false}));cone.rotation.x=Math.PI;cone.renderOrder=999;marker.add(cone);marker.visible=false;
    vm=buildGun();vm.scale.setScalar(.9);vm.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.depthTest=false;o.renderOrder=998;}});vm.visible=false;
    muzzle.scale.set(.45,.45,1);muzzle.position.set(0,0,-.85);muzzle.renderOrder=1000;vm.add(muzzle);camera.add(vm);
    defineIA();active=H.scene;active.add(camera);active.add(marker);
  }]);
  for(let i=0;i<steps.length;i++){
    $('ltxt').textContent=steps[i][0];$('lbar').style.width=((i+1)/steps.length*100)+'%';
    await wait(30);steps[i][1]();
  }
  applyQuality();
  renderer.render(active,camera);
  refreshMenuEnd();
  $('loading').style.display='none';$('menu').style.display='flex';
  window.__dbg={cellAt:cellAt,CELL:CELL,CS:CS,HUB:HUB,G:G,pl:pl,H:H,BR:BR,Mon:Mon,W:W,MC:MC,PH:PH,IAs:IAs,step:step,startGame:startGame,shoot:shoot,fromCamera:()=>camera,tris:Mon.M.tris};
}
init().catch(e=>{console.error(e);$('ltxt').textContent='Ошибка загрузки: '+e.message;});
})();

</script>
